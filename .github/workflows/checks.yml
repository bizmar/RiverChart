name: Checks

# Runs on every push to main, every pull request, and on demand. A failed run emails the repo owner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: |
          pip install --quiet ruff==0.16.8
          ruff check scripts tests --output-format github
      - name: Tests
        run: python -m unittest discover tests -v

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: JavaScript syntax
        run: for f in site/*.js; do node --check "$f" && echo "ok $f"; done
      - name: JSON files parse
        run: for f in site/*.webmanifest; do [ -e "$f" ] || continue; node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
