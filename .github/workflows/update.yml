name: Update data and publish

on:
  schedule:
    - cron: "4,34 * * * *"   # every 30 min, a few minutes after ARSO publishes
    - cron: "17 3 * * *"     # daily: re-check the archive for newly validated years (e.g. 2025)
  workflow_dispatch:
    inputs:
      archive:
        description: "Daily archive: missing = new stations only, recent = last 3 years, full = everything"
        type: choice
        options: [missing, recent, full]
        default: missing
      wayback:
        description: "Import Internet Archive copies of ARSO's station tables since this date (YYYY or YYYYMMDD), to fill gaps. Leave empty normally."
        type: string
        default: ""
      debug:
        description: Print samples of the raw ARSO responses
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v5

      - name: Tests
        run: python3 -m unittest discover tests

      - name: Get stored data (data branch)
        run: git clone --quiet --depth 1 --branch data "$REPO_URL" store || mkdir -p store

      - name: Fetch from ARSO
        id: fetch
        continue-on-error: true
        env:
          WAYBACK: ${{ inputs.wayback }}
        run: |
          archive="${{ inputs.archive || 'missing' }}"
          if [ "${{ github.event.schedule }}" = "17 3 * * *" ]; then archive=recent; fi
          extra=()
          if [ -n "$WAYBACK" ]; then
            [[ "$WAYBACK" =~ ^[0-9]{4}([0-9]{4})?$ ]] || { echo "::error::wayback must be YYYY or YYYYMMDD"; exit 1; }
            extra+=(--wayback "$WAYBACK")
          fi
          python3 scripts/update.py --store store --archive "$archive" "${extra[@]}" ${{ inputs.debug && '--debug' || '' }}

      # The data branch is rewritten as a single commit each time, so the repository
      # does not grow with every update. The files themselves keep the full history.
      - name: Save data
        if: steps.fetch.outcome == 'success'
        run: |
          cd store
          rm -rf .git
          git init --quiet --initial-branch data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Data as of $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "$REPO_URL" data

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          rsync -a --exclude .git store/ _site/data/
          # Cache-busting: tag app.js and style.css with the commit, so a new page never runs with old cached code.
          v="${GITHUB_SHA::7}"
          sed -i -e "s#src=\"app.js\"#src=\"app.js?v=$v\"#" -e "s#href=\"style.css\"#href=\"style.css?v=$v\"#" _site/index.html
          grep -q "app.js?v=$v" _site/index.html && grep -q "style.css?v=$v" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Fetching from ARSO failed - the site was published with the previous data."
          exit 1
